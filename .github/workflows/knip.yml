name: Knip

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  knip:
    name: Dead-code & unused-deps report
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Read-only report job — nothing here pushes with the git-config
          # credential, so don't persist the checkout token for the rest of the job.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Blocking: a newly-dead export fails the PR that introduces it. Intentional
      # public surface knip can't see belongs in `knip.json` (`entry`,
      # `ignoreExportsUsedInFile`, `ignoreDependencies`) — that is the escape hatch.
      - name: Run knip
        run: npm run knip
