name: Lint & Format

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Read-only lint job — nothing here pushes with the git-config
          # credential, so don't persist the checkout token for the rest of the job.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check GitHub Actions are SHA-pinned
        run: npm run lint:actions

      - name: Check formatting with Prettier
        run: npm run format-check

      - name: TypeScript type check
        run: npx tsc --noEmit --skipLibCheck

      - name: TypeScript type check (tests)
        run: npm run typecheck:test

      - name: Run ESLint
        run: npm run lint

      - name: Check for circular imports
        run: npm run lint:cycles
